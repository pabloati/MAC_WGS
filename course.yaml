name: course
channels:
  - conda-forge
  - bioconda
dependencies:
  # Quality Control & Preprocessing
  - nanoplot >=1.42.0
  - nanofilt >=2.8.0

  # De Novo Assemblers & Graph Tools
  - flye >=2.9.3
